:root{
  --bg:#F8F6E9;--surface:#FFFFFF;--ink:#14261E;--muted:#55665D;--line:#DAD6BF;--chip:#EEEBD9;--field:#FFFFFF;
  --deep:#0F4D3A;--deep2:#0A3A2B;--on-deep:#F8F6E9;--cream:#F8F6E9;--silver:#E8E8E8;
  --gold:#D4AF37;--gold-ink:#7A5C0B;--on-gold:#1B1500;--gold-grad:linear-gradient(135deg,#F3DE92 0%,#D4AF37 55%,#A8841F 100%);
  --ok:#17693F;--warn:#9A4506;--bad:#B42318;--focus:#1B5FBF;--veg:#1F8A4C;--nonveg:#C0392B;
  --art1:91%;--art2:79%;--art-ink:#14261E;--soft:#F3EBC8;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1F18;--surface:#11302A;--ink:#F1EFE0;--muted:#A6B8AE;--line:#25483C;--chip:#1A3F34;--field:#0C241C;
  --gold:#E2BC4A;--gold-ink:#EBCB6A;--soft:#2A2A14;--ok:#5CC58C;--warn:#F0A94B;--bad:#FF8A80;--focus:#7DB2FF;--art1:24%;--art2:17%;--art-ink:#F1EFE0}}
:root[data-theme="dark"]{
  --bg:#0A1F18;--surface:#11302A;--ink:#F1EFE0;--muted:#A6B8AE;--line:#25483C;--chip:#1A3F34;--field:#0C241C;
  --gold:#E2BC4A;--gold-ink:#EBCB6A;--soft:#2A2A14;--ok:#5CC58C;--warn:#F0A94B;--bad:#FF8A80;--focus:#7DB2FF;--art1:24%;--art2:17%;--art-ink:#F1EFE0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45}
h1,h2,h3,.eyebrow{font-family:"Outfit","Trebuchet MS",system-ui,sans-serif;margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.5}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}small{font-weight:500;color:var(--muted)}
.pad{padding:8px 16px}.c{text-align:center}
[hidden]{display:none!important}

/* generic parts */
.btn{border:0;border-radius:12px;min-height:46px;padding:0 18px;font-weight:700;background:var(--chip);display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn.gold{background:var(--gold-grad);color:var(--on-gold)}
.btn.ghost{background:transparent;border:2px solid var(--line)}
.btn.ghost.light{border-color:#555;color:#fff}
.btn.sm{min-height:44px;padding:0 14px;font-size:15px;border-radius:10px}
.btn.block{width:100%}.btn.grow{flex:1}
.btn.dashed{border-style:dashed;font-weight:500}
.ib{width:44px;height:44px;border-radius:50%;border:0;background:var(--chip);font-size:20px}
.lnk{border:0;background:none;color:var(--gold-ink);font-weight:700;text-decoration:underline;min-height:44px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-ink);font-weight:600}
.pt{font-size:28px;margin:8px 0 4px}
.sh{font-size:20px;padding:20px 16px 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sh small{font-size:13px}
.field{width:100%;min-height:46px;border:2px solid var(--line);background:var(--field);border-radius:12px;padding:0 12px}
.field.big{font-size:18px}.field.sm{min-height:44px;width:auto;max-width:100%}.field.num{width:90px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 16px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;border:2px solid var(--line);background:var(--surface);border-radius:999px;min-height:44px;padding:0 14px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip.tri.like{border-color:var(--ok);color:var(--ok)}.chip.tri.skip{border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.pill{display:inline-flex;align-items:center;gap:5px;background:var(--chip);border-radius:999px;padding:3px 10px;font-size:14px;font-weight:600}
.pill.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.pill.fav{background:var(--soft);color:var(--gold-ink)}.pill.ok{color:var(--ok)}.pill.no{color:var(--bad)}
.vm{display:inline-block;width:14px;height:14px;border:2px solid var(--veg);border-radius:3px;position:relative;vertical-align:-2px}
.vm::after{content:"";position:absolute;inset:2px;border-radius:50%;background:var(--veg)}

    pay:[{id:'p1',label:'UPI (add your UPI ID)'},{id:'p3',label:'Cash on delivery'}],prefsMenu:{kid:'A',likes:[],skips:[]}};
}
function payFor(o){return Math.round(25+6*o.km);}

/* ---------- geo ---------- */
const areaPos=a=>a.lat!==undefined?{lat:a.lat,lng:a.lng}:ll(a.dx,a.dy);
const distTo=k=>hav(S.loc,k);
const etaOf=(k,d)=>k.prep+Math.round(d*3);
function nearby(){
  return Object.values(S.kitchens).filter(k=>k.active).map(k=>{const d=distTo(k);return{...k,dist:d,eta:etaOf(k,d)};})
    .filter(k=>k.dist<=S.radius).sort((a,b)=>a.dist-b.dist);
}
const outsideCount=()=>Object.values(S.kitchens).filter(k=>k.active&&distTo(k)>S.radius).length;

/* ---------- capacity ---------- */
const need=size=>size==='half'?0.5:1;
const remaining=k=>k.cap-k.used;
const canFit=(k,size)=>remaining(k)>=need(size);
function capLabel(k){const r=remaining(k);
  if(r<0.5)return{t:'Sold out',lvl:'bad'};
  if(r<1)return{t:'Only half tiffins left',lvl:'warn'};
  if(r<=5)return{t:'Only '+Math.floor(r)+' tiffin'+(Math.floor(r)===1?'':'s')+' remaining',lvl:'warn'};
  return{t:'Available',lvl:'ok'};}

/* ---------- dishes / listings ---------- */
const kdList=()=>Object.values(S.kd).filter(k=>k.active!==false);
function listing(kd){const k=S.kitchens[kd.kid],d=distTo(k),cat=CAT[kd.did],t=S.T[kd.kid][kd.did];
  return{kd,key:kd.key,kid:kd.kid,did:kd.did,k,dist:d,eta:etaOf(k,d),cat,rating:kd.rating,price:dishPrice(kd.did,S.size,kd.kid),today:(t&&t.todayStatus)||'available',fav:!!S.cust.favs[kd.key],
    tomorrow:t.status,cap:capLabel(k),inRange:d<=S.radius&&k.active};}
const nearListings=()=>kdList().map(listing).filter(l=>l.inRange&&!(S.cust&&S.cust.vegOnly&&!l.cat.veg));
const tierOf=()=>S.cust.tierOverride||(S.subs.find(s=>s.cid===S.cust.id)||{}).tier||'none';
const rank=()=>TIER_RANK[tierOf()];

function search(q){
  q=q.trim().toLowerCase(); if(!q)return{dishes:[],kitchens:[]};
  const words=q.split(/\s+/);
  const tag=l=>[l.cat.n,l.cat.c,l.cat.veg?'veg vegetarian':'non-veg nonveg non veg',/chicken/.test(l.cat.n.toLowerCase())?'chicken':'',l.k.n,'tiffin'].join(' ').toLowerCase();
  const dishes=nearListings().filter(l=>{const t=tag(l);return words.every(w=>t.includes(w));});
  const kitchens=nearby().filter(k=>words.every(w=>(k.n+' '+k.area).toLowerCase().includes(w)));
  return{dishes,kitchens};
}

/* ---------- tomorrow availability ---------- */
function tomorrowOK(kid,did){const t=S.T[kid][did];return !!t&&t.status!=='unavailable'&&t.confirmed<t.cap;}
const kitchenOpenTomorrow=kid=>S.kitchens[kid].active&&S.T[kid]._meals<S.T[kid]._max;
function staples(kid){const out=[];['dal','bread','rice'].forEach(c=>{
  const best=Object.values(S.kd).filter(x=>x.kid===kid&&CAT[x.did].c===c&&tomorrowOK(kid,x.did)).sort((a,b)=>b.rating-a.rating)[0];
  if(best)out.push(best.did);});return out;}
function bestMain(kid,veg){return Object.values(S.kd).filter(x=>x.kid===kid&&isMain(x.did)&&tomorrowOK(kid,x.did)&&(!veg||CAT[x.did].veg)).sort((a,b)=>b.rating-a.rating)[0];}

/* ---------- planning the meal a subscriber gets tomorrow ---------- */
function planTomorrow(sub){
  const rk=TIER_RANK[sub.tier], c=nearby().filter(k=>kitchenOpenTomorrow(k.id)), notes=[], reasons=[];
  if(!c.length)return{kid:null,kitchen:null,dishes:[],notes:['No kitchen within '+S.radius+' km has capacity tomorrow.'],reasons:[]};
  const favs=Object.keys(S.cust.favs).map(k=>({key:k,kid:k.split(':')[0],did:k.split(':')[1],...S.cust.favs[k]}));
  const fill=(kid,picked)=>{const d=[...picked];
    if(!d.some(isMain)){const m=bestMain(kid);if(m)d.push(m.did);}
    staples(kid).forEach(s=>{if(!d.some(x=>CAT[x].c===CAT[s].c))d.push(s);});return d;};
  const proPick=()=>{
    let best=null;
    c.forEach(k=>{const fk=favs.filter(f=>f.kid===k.id&&tomorrowOK(k.id,f.did));
      const sc=fk.reduce((a,f)=>a+3*((f.rating||4)/5),0)+k.rating/5+(1-k.dist/S.radius)*0.5;
      if(!best||sc>best.sc)best={k,fk,sc};});
    const picked=best.fk.sort((a,b)=>(b.rating||0)-(a.rating||0)).slice(0,4).map(f=>f.did);
    best.fk.forEach(f=>reasons.push('Your favourite '+CAT[f.did].n+' is available tomorrow from '+best.k.n));
    favs.filter(f=>f.kid!==best.k.id&&tomorrowOK(f.kid,f.did)&&S.kitchens[f.kid].active).forEach(f=>notes.push(CAT[f.did].n+' from '+S.kitchens[f.kid].n+' is also available, but one tiffin is packed by one kitchen. It will be in a future meal.'));
    return{kid:best.k.id,dishes:fill(best.k.id,picked)};};
  let res;
  if(rk<=1){
    const i=(sub.done+sub.skipsUsed)%Math.min(3,c.length), k=c[i];
    res={kid:k.id,dishes:fill(k.id,[])};reasons.push('Regular tiffin from '+k.n+', a different kitchen each day when available.');
  }else if(rk===2){res=proPick();}
  else{
    const pm=sub.menu, k=pm&&c.find(x=>x.id===pm.kid);
    if(k){
      const picked=[];
      pm.likes.forEach(did=>{
        if(tomorrowOK(k.id,did))picked.push(did);
        else{const alt=Object.values(S.kd).filter(x=>x.kid===k.id&&CAT[x.did].c===CAT[did].c&&!pm.skips.includes(x.did)&&tomorrowOK(k.id,x.did)&&!pm.likes.includes(x.did)).sort((a,b)=>b.rating-a.rating)[0];
          notes.push(CAT[did].n+' is unavailable tomorrow at '+k.n+(alt?'; swapped for '+CAT[alt.did].n+'.':'.'));if(alt)picked.push(alt.did);}
      });
      let dishes=picked.filter(d=>!pm.skips.includes(d));
      if(rk===4&&sub.premium&&tomorrowOK(k.id,sub.premium)){dishes=dishes.filter(d=>!isMain(d));dishes.unshift(sub.premium);reasons.push('Premium '+CAT[sub.premium].n+' from '+k.n);}
      else if(rk===4&&sub.premium){notes.push('Your premium '+CAT[sub.premium].n+' is not available at '+k.n+' tomorrow, so a regular main was used.');}
      res={kid:k.id,dishes:dishes.length?dishes:fill(k.id,[])};
      reasons.push('Built from your saved menu at '+k.n);
    }else{notes.push('Your chosen kitchen is out of range or full tomorrow. We matched your taste from nearby kitchens instead.');res=proPick();}
  }
  return{kid:res.kid,kitchen:S.kitchens[res.kid],dishes:res.dishes,notes,reasons};
}
function bookTomorrow(sub,delta){
  const p=planTomorrow(sub); if(!p.kid)return p;
  p.dishes.forEach(d=>{S.T[p.kid][d].confirmed=Math.max(0,S.T[p.kid][d].confirmed+delta);});
  S.T[p.kid]._meals=Math.max(0,S.T[p.kid]._meals+delta);return p;}

/* ---------- recommendation engine ---------- */
function recommend(limit=6){
  const rk=rank(), maxH=Math.max(1,...kdList().map(k=>S.T[k.kid][k.did].hist));
  const favCats=new Set(Object.keys(S.cust.favs).map(k=>CAT[k.split(':')[1]].c));
  return nearListings().filter(l=>['sabzi','protein','premium','dal'].includes(l.cat.c)&&canFit(l.k,S.size)&&l.tomorrow!=='unavailable').map(l=>{
    const t=S.T[l.kid][l.did], rem=remaining(l.k);
    const s=(rk>=2?0.32:0.12)*(l.fav?1:0)+0.2*(l.rating/5)+0.1*(l.k.rating/5)+0.15*(1-l.dist/S.radius)+0.08*(favCats.has(l.cat.c)?1:0)+0.1*(t.hist/maxH)+(rem<=5?-0.1:0.05);
    let why;
    if(l.fav&&tomorrowOK(l.kid,l.did))why='Your favourite '+l.cat.n+' is available tomorrow from '+l.k.n;
    else if(l.fav)why='Your favourite, available today from '+l.k.n;
    else if(l.rating>=4.6)why='Top rated near you, '+l.rating.toFixed(1)+' ★';
    else why='Ready in about '+l.eta+' min';
    return{...l,score:s,why};
  }).sort((a,b)=>b.score-a.score).slice(0,limit);
}

/* ---------- pricing ---------- */
function planPrice(tier,days,size){const per=TIERS[tier].price[size], tot=per*days*(days===7?0.95:0.88);return{perMeal:Math.round(tot/days),total:Math.round(tot)};}

/* ---------- orders ---------- */
const addrPos=a=>a.lat!==undefined?{lat:a.lat,lng:a.lng}:ll(a.dx,a.dy);
function tiffinItems(kid,did,size){
  const items=[{did,role:'main'}];
  ['dal','bread','rice'].forEach(c=>{const b=Object.values(S.kd).filter(x=>x.kid===kid&&CAT[x.did].c===c).sort((a,b)=>b.rating-a.rating)[0];
    if(b&&b.did!==did)items.push({did:b.did,role:c,qty:c==='bread'?(size==='half'?2:4):1});});
  return items;}
function buildItems(kid,lines){
  const out=[],add=(did,role,q)=>{const e=out.find(x=>x.did===did&&x.role===role);if(e)e.q+=q;else out.push({did,role,q});};
  lines.forEach(l=>{add(l.did,'main',l.qty);tiffinItems(kid,l.did,l.size).filter(it=>it.role!=='main').forEach(it=>add(it.did,it.role,(it.qty||1)*l.qty));});
  return out.map(x=>({did:x.did,role:x.role,...(x.q>1?{qty:x.q}:{})}));}
const unitsOf=lines=>lines.reduce((a,l)=>a+need(l.size)*l.qty,0);
const priceOf=(lines,kid)=>lines.reduce((a,l)=>a+dishPrice(l.did,l.size,kid)*l.qty,0);
const orderOK=l=>canFit(l.k,S.size)&&l.today!=='unavailable';
const tiffinCount=o=>(o.lines||[{qty:1}]).reduce((a,l)=>a+l.qty,0);
function makeOrder({kid,did,size,lines,who,cid,addr,seed}){
  lines=lines&&lines.length?lines.map(l=>({did:l.did,size:l.size,qty:l.qty})):[{did,size,qty:1}];
  const k=S.kitchens[kid], a=addrPos(addr), km=hav(k,a), units=unitsOf(lines);
  const o={id:'HE-'+(++S.seq),cid,who,kid,did:lines[0].did,size:lines[0].size,lines,units,items:buildItems(kid,lines),price:priceOf(lines,kid),km,eta:etaOf(k,km),
    addr:{text:addr.text,area:addr.area||'Zone 1',...a},status:'confirmed',partner:null,hist:[{s:'confirmed',t:Date.now()}],rated:false,day:'today'};
  k.used+=units; S.orders.unshift(o); return o;}
function placeOrder({kid,did,size,lines,addr,pay}){
  const k=S.kitchens[kid]; if(!k||!k.active)throw new Error('Kitchen not available');
  lines=lines&&lines.length?lines:[{did,size,qty:1}];
  if(lines.some(l=>!S.kd[kid+':'+l.did]))throw new Error('This kitchen does not make one of these dishes');
  if(lines.some(l=>!(l.qty>=1&&l.qty<=10)))throw new Error('Quantity must be between 1 and 10');
  if(hav(k,addrPos(addr))>S.radius)throw new Error('Address is outside the '+S.radius+' km service radius');
  const units=unitsOf(lines),r=remaining(k);
  if(r<units)throw new Error(r<0.5?'This kitchen is sold out':r<1?'Only half tiffins are left at this kitchen':'Only '+Math.floor(r)+' tiffin'+(Math.floor(r)===1?'':'s')+' left at this kitchen');
  const o=makeOrder({kid,lines,who:S.cust.name,cid:S.cust.id,addr});
  const n=tiffinCount(o);
  S.payments.unshift({id:'PAY-'+(9100+S.seq%900),cid:S.cust.id,what:n>1?'One-time order · '+n+' tiffins':'One-time '+(lines[0].size==='half'?'Half':'Full')+' tiffin · '+CAT[lines[0].did].n,amt:o.price,t:Date.now(),how:pay,state:'paid'});
  return o;}

/* ---------- role-checked API: every read/write goes through here ---------- */
const api={
  ordersFor(sess){
    if(sess.role==='customer')return S.orders.filter(o=>o.cid===sess.id);
    if(sess.role==='kitchen')return S.orders.filter(o=>o.kid===sess.kid);
    if(sess.role==='delivery'){const p=S.partners[sess.id];return S.orders.filter(o=>(o.status==='ready'&&!o.partner&&(!p.loc||!S.kitchens[o.kid]||hav(S.kitchens[o.kid],p.loc)<=15))||o.partner===sess.id);}
    if(sess.role==='admin')return S.orders.slice();
    return [];},
  view(sess,o){ // strips personal data the caller must not see
    const v={...o};
    if(sess.role==='delivery'&&o.partner!==sess.id){v.who=o.who.split(' ')[0]+' '+(o.who.split(' ')[1]||'')[0]+'.';v.addr={area:o.addr.area,text:'Full address shown after you accept'};}
    if(sess.role==='kitchen'){v.addr={area:o.addr.area,text:o.addr.area};v.who=o.who.split(' ')[0];}
    return v;},
  advance(sess,oid,act){
    const a=ACT[act],o=S.orders.find(x=>x.id===oid);
    if(!a||!o)throw new Error('Unknown action');
    if(a.role!==sess.role)throw new Error('Not permitted for this role');
    if(sess.role==='kitchen'&&o.kid!==sess.kid)throw new Error('Not your order');
    if(sess.role==='delivery'&&act!=='claim'&&o.partner!==sess.id)throw new Error('Not your delivery');
    if(o.status!==a.from)throw new Error('Order is '+SLABEL[o.status]+'; cannot do that now');
    if(act==='claim'){if(!S.partners[sess.id].online)throw new Error('Go online first');o.partner=sess.id;}
    o.status=a.to;o.hist.push({s:a.to,t:Date.now()});
    if(['accepted','assigned','out','delivered'].includes(a.to))notify(o.cid,o.id+': '+SLABEL[a.to],S.kitchens[o.kid].n+(a.to==='delivered'?' · please rate your tiffin':''),'orders');
    if(a.to==='delivered'){const p=S.partners[o.partner];p.done++;p.earned+=payFor(o);S.kitchens[o.kid].payoutToday+=o.price*(1-S.kitchens[o.kid].commission/100);
      o.items.forEach(it=>{const key=o.kid+':'+it.did;if(S.kd[key])S.kd[key].orders++;if(o.cid===S.cust.id&&S.cust.favs[key])S.cust.favs[key].times++;});}
    return o;},
  cancel(sess,oid){const o=S.orders.find(x=>x.id===oid&&x.cid===sess.id);
    if(sess.role!=='customer'||!o)throw new Error('Not permitted');if(o.status!=='confirmed')throw new Error('Kitchen already accepted this order');
    o.status='cancelled';S.kitchens[o.kid].used-=(o.units||need(o.size));return o;},
  toggleFav(sess,key){if(sess.role!=='customer')throw new Error('Not permitted');
    const [kid,did]=key.split(':'),t=S.T[kid][did];
    if(S.cust.favs[key]){delete S.cust.favs[key];t.favCount=Math.max(0,t.favCount-1);return false;}
    S.cust.favs[key]={rating:0,times:S.orders.filter(o=>o.cid===sess.id&&o.kid===kid&&o.items.some(i=>i.did===did)).length};t.favCount++;return true;},
  rate(sess,oid,r){const o=S.orders.find(x=>x.id===oid&&x.cid===sess.id);
    if(sess.role!=='customer'||!o)throw new Error('Not permitted');if(o.status!=='delivered')throw new Error('Rate after delivery');if(o.rated)throw new Error('Already rated');
    Object.entries(r.dishes).forEach(([did,st])=>{const key=o.kid+':'+did,d=S.kd[key];if(!d||!st)return;d.rating=+((d.rating*d.rc+st)/(d.rc+1)).toFixed(2);d.rc++;if(S.cust.favs[key])S.cust.favs[key].rating=st;});
    if(r.kitchen){const k=S.kitchens[o.kid];k.rating=+((k.rating*k.ratingCount+r.kitchen)/(k.ratingCount+1)).toFixed(2);k.ratingCount++;}
    o.rated=true;o.rating=r;return o;},
  setTomorrow(sess,did,patch){if(sess.role!=='kitchen')throw new Error('Not permitted');const t=S.T[sess.kid][did];if(!t)throw new Error('No such dish');Object.assign(t,patch);return t;},
  setMax(sess,n){if(sess.role!=='kitchen')throw new Error('Not permitted');S.T[sess.kid]._max=Math.max(0,n|0);},
  setRadius(sess,n){if(sess.role!=='admin')throw new Error('Not permitted');S.radius=Math.max(1,Math.min(50,n));}
};

/* ---------- subscriptions ---------- */
function subscribe(cfg){
  const sub={id:'SUB-'+(++S.seq),cid:S.cust.id,tier:cfg.tier,days:cfg.days,size:cfg.size,done:0,skipsUsed:0,pausesUsed:0,changesUsed:0,paused:false,slot:cfg.slot,addr:cfg.addr,
    start:Date.now()+86400000,expiry:Date.now()+(cfg.days+1)*86400000,menu:cfg.menu||null,premium:cfg.premium||null,custom:cfg.custom||{}};
  S.subs.unshift(sub);const p=bookTomorrow(sub,+1);
  const pr=planPrice(cfg.tier,cfg.days,cfg.size);
  S.payments.unshift({id:'PAY-'+(9100+S.seq%900),cid:S.cust.id,what:cfg.days+' DAY '+TIERS[cfg.tier].n.toUpperCase()+' · '+(cfg.size==='half'?'Half':'Full')+' Tiffin',amt:pr.total,t:Date.now(),how:cfg.pay,state:'paid'});
  return{sub,plan:p};}
function subAction(sub,act){
  const rl=RULES[sub.days];
  if(act==='skip'){if(sub.skipsUsed>=rl.skips)throw new Error('Skip limit reached for this plan ('+rl.skips+')');bookTomorrow(sub,-1);sub.skipsUsed++;sub.expiry+=86400000;}
  else if(act==='pause'){if(!rl.pauses)throw new Error('Pause is not available on 7-day plans');if(sub.pausesUsed>=rl.pauses)throw new Error('Pause limit reached');bookTomorrow(sub,-1);sub.paused=true;sub.pausesUsed++;}
  else if(act==='resume'){sub.paused=false;bookTomorrow(sub,+1);}
  else if(act==='shift'){if(!rl.changes)throw new Error('Changing delivery date is not available on 7-day plans');if(sub.changesUsed>=rl.changes)throw new Error('Date change limit reached');sub.changesUsed++;sub.expiry+=86400000;}
  else if(act==='renew'){const n=subscribe({tier:sub.tier,days:sub.days,size:sub.size,slot:sub.slot,addr:sub.addr,menu:sub.menu,premium:sub.premium,custom:sub.custom,pay:'UPI'});return n.sub;}
  return sub;}
function upgradeSub(sub,tier){
  const rem=sub.days-sub.done, a=planPrice(sub.tier,sub.days,sub.size).perMeal, b=planPrice(tier,sub.days,sub.size).perMeal, diff=Math.max(0,(b-a)*rem);
  bookTomorrow(sub,-1);sub.tier=tier;bookTomorrow(sub,+1);
  S.payments.unshift({id:'PAY-'+(9100+(++S.seq)%900),cid:S.cust.id,what:'Upgrade to '+TIERS[tier].n+' ('+rem+' meals)',amt:diff,t:Date.now(),how:'UPI',state:'paid'});return diff;}
const remainingMeals=sub=>sub.days-sub.done;

/* ---------- demand aggregation: confirmed and estimated are always separate ---------- */
function kitchenDemand(kid){
  const rows=Object.keys(S.T[kid]).filter(k=>k[0]!=='_').map(did=>{
    const t=S.T[kid][did],base=0.35*t.confirmed+0.6*t.favCount+0.25*t.hist;
    return{did,status:t.status,cap:t.cap,confirmed:t.confirmed,estLo:Math.round(base*0.8),estHi:Math.round(base*1.2),favCount:t.favCount,left:Math.max(0,t.cap-t.confirmed)};});
  const meals=S.T[kid]._meals,max=S.T[kid]._max;
  return{rows:rows.sort((a,b)=>b.confirmed-a.confirmed),meals,max,over:meals>max};}
function adminStats(){
  const today=S.orders.filter(o=>o.status!=='cancelled');
  const gmv=S.base.gmv+today.reduce((a,o)=>a+o.price,0);
  const perf=Object.values(S.kitchens).map(k=>{const os=S.orders.filter(o=>o.kid===k.id&&o.status!=='cancelled').length;
    const d=kitchenDemand(k.id),conf=d.rows.reduce((a,r)=>a+r.confirmed,0),est=d.rows.reduce((a,r)=>a+(r.estLo+r.estHi)/2,0);
    return{...k,orders:os,util:Math.round(100*k.used/k.cap),conf,est:Math.round(est)};});
  return{orders:S.base.orders+S.orders.length,ordersToday:today.length,subs:S.base.subs+S.subs.length,kitchens:Object.values(S.kitchens).filter(k=>k.active).length,
    partners:Math.max(0,S.base.partners+Object.keys(S.partners).length-(CONFIG.DEMO_MODE?3:0)),pending:pendingApps().length,gmv,perf,waste:4.2};}

/* ---------- authentication and roles (server-side in production) ---------- */
const normPhone=p=>String(p||'').replace(/\D/g,'').slice(-10);
const userByPhone=p=>S.users.find(u=>u.phone===normPhone(p));
const userById=id=>S.users.find(u=>u.id===id);
function normCustomer(c){

function ensureCustomer(u){if(!S.customers[u.id])S.customers[u.id]=blankCustomer(u.id,u.name,u.phone);return normCustomer(S.customers[u.id]);}
function signIn(u){S.auth.user=u;if(u.roles.includes('CUSTOMER'))S.cust=ensureCustomer(u);else S.cust=S.guest;return u;}

function loginWithOtp(phone,code){

function render(){
  const root=$('#root');let h;
  if(UI.role==='customer')h=customerApp();
  else{
    const s=sessionFor(UI.role);
    if(!s){UI.role='customer';UI.screen=S.auth.user?'app':'welcome';setTimeout(()=>toast('You do not have access to that area.'),0);h=customerApp();}
    else h=panelBar()+(UI.role==='kitchen'?kitchenApp():UI.role==='delivery'?deliveryApp():adminApp());
  }
  root.innerHTML=h+(UI.testInfo?testModal():'');
  document.body.dataset.mode=UI.role==='customer'?'customer':'panel';
  afterRender();
}
function go(view,param){const c=UI.c;c.stack.push({view:c.view,param:c.param,tab:c.tab});c.view=view;c.param=param||null;window.scrollTo(0,0);render();}
function tab(t){const c=UI.c;c.stack=[];c.view=t;c.tab=t;c.param=null;window.scrollTo(0,0);render();}
function back(){const c=UI.c,p=c.stack.pop();if(p){c.view=p.view;c.param=p.param;c.tab=p.tab;}else{c.view='home';c.tab='home';}render();}
function panelBar(){
  const u=S.auth.user,r=UI.role,t={kitchen:'Kitchen Partner',delivery:'Delivery Partner',admin:'Admin'}[r];

}

function customerApp(){
  const c=UI.c,v=c.view,s=UI.screen;
  if(s==='welcome')return phoneWrap(welcomeView());

  if(s==='staff')return phoneWrap(staffView());
  const gated=!S.auth.user&&['subs','taste','orders','profile','notes','pform','pstatus','papps','cart','chat'].includes(v);
  const body=gated?gateView():v==='home'?(nearby().length?cvHome():emptyRange()):v==='search'?cvSearch():v==='subs'?cvSubs():v==='taste'?cvTaste():v==='orders'?cvOrders():v==='profile'?cvProfile():v==='notes'?cvNotes():v==='settings'?cvSettings():v==='chat'?cvChat():v==='kitchen'?cvKitchen(c.param):v==='track'?cvTrack(c.param):v==='dish'?cvDish(c.param):v==='cart'?cvCart():v==='pform'?cvPartnerForm(c.param):v==='pstatus'?cvPartnerStatus(c.param):v==='papps'?cvPartnerApps():'';

}

function fDishes(list){const f=UI.c.filter;
  if(f==='veg')return list.filter(l=>l.cat.veg);if(f==='nonveg')return list.filter(l=>!l.cat.veg);if(f==='premium')return list.filter(l=>l.cat.c==='premium');
  if(f==='fav')return list.filter(l=>l.fav);if(f==='today')return list.filter(l=>l.cap.lvl!=='bad');if(f==='near')return list.filter(l=>l.dist<=6);
  if(f==='sub')return list.filter(l=>l.k.plans.includes(7));if(f==='one')return list.filter(l=>l.k.plans.includes(1));
  if(f==='popular')return [...list].sort((a,b)=>b.kd.orders-a.kd.orders);return list;}
function fKitchens(list){const f=UI.c.filter;
  if(f==='veg')return list.filter(k=>k.veg);if(f==='nonveg')return list.filter(k=>!k.veg);
  if(f==='premium')return list.filter(k=>Object.values(S.kd).some(x=>x.kid===k.id&&CAT[x.did].c==='premium'));
  if(f==='today')return list.filter(k=>capLabel(k).lvl!=='bad');if(f==='near')return list.filter(k=>k.dist<=6);
  if(f==='sub')return list.filter(k=>k.plans.includes(7));if(f==='one')return list.filter(k=>k.plans.includes(1));
  if(f==='popular')return [...list].sort((a,b)=>b.rating-a.rating);

    <h2 class="sh">${list.length} kitchens within ${S.radius} km</h2>${list.map(kcard).join('')||'<p class="muted pad">No kitchens match.</p>'}`;}
  if(m==='tiffins'){const list=nearListings().filter(l=>isMain(l.did)).sort((a,b)=>b.rating-a.rating);
    return seg+`<div class="seg" role="group" aria-label="Tiffin size"><button data-a="size" data-s="half" aria-pressed="${S.size==='half'}">Half Tiffin</button><button data-a="size" data-s="full" aria-pressed="${S.size==='full'}">Full Tiffin</button></div>
    <h2 class="sh">Today's tiffins <small>${list.length} near you</small></h2>${list.map(dishRow).join('')}`;}
  return seg+`<div class="pad"><label class="sr" for="q">Search</label><input id="q" class="field big" data-live="q" value="${esc(c.q)}" placeholder="Bhindi, dal, chicken, veg, kitchen…" autocomplete="off">
  <div class="chips wrap" role="group" aria-label="Quick searches">${['Bhindi','Baingan','Dal','Paneer','Chicken','Veg','Tiffin'].map(s=>`<button class="chip" data-a="qs" data-q="${s}">${s}</button>`).join('')}</div>
  <div class="seg sm" role="group" aria-label="Sort">${[['distance','Nearest'],['rating','Top rated'],['price','Cheapest']].map(([k,l])=>`<button data-a="sort" data-s="${k}" aria-pressed="${c.sort===k}">${l}</button>`).join('')}</div></div>
  <div id="results">${searchResults()}</div>`;}
function searchResults(){const c=UI.c,r=search(c.q);
  if(!c.q.trim())return '<p class="muted pad">Search a dish to compare it across nearby kitchens: price, rating, distance and delivery time.</p>';
  const by={distance:(a,b)=>a.dist-b.dist,rating:(a,b)=>b.rating-a.rating,price:(a,b)=>a.price-b.price}[c.sort];
  const d=[...r.dishes].sort(by);
  if(!d.length&&!r.kitchens.length)return `<p class="muted pad">Nothing within ${S.radius} km matches “${esc(c.q)}”.</p>`;
  return `${d.length?`<h2 class="sh">${d.length} match${d.length===1?'':'es'} nearby</h2>${d.map(dishRow).join('')}`:''}${r.kitchens.length?`<h2 class="sh">Kitchens</h2>${r.kitchens.map(kcard).join('')}`:''}`;}

  ${p?`<div class="box mx"><div class="eyebrow">Delivery partner</div><b>${esc(p.n)}</b> <span class="muted">· ${p.id} · number shared only during delivery</span></div>`:''}
  <div class="box mx"><div class="eyebrow">In your tiffin</div>${o.items.map(it=>`<div>${esc(dn(it.did))}${it.qty?` ×${it.qty}`:''}</div>`).join('')}</div>

const addrList=()=>{const a=S.cust.addresses.map(x=>x.lat!==undefined?{...x}:{...x,...ll(x.dx,x.dy)});a.push({id:'cur',label:'Current location',text:S.loc.name,lat:S.loc.lat,lng:S.loc.lng});return a;};
const payLabel=id=>S.cust.pay.find(p=>p.id===id).label;
const dots=(n,cur)=>`<ol class="dots" aria-label="Step ${cur} of ${n}">${Array.from({length:n},(_,i)=>`<li class="${i+1<cur?'done':i+1===cur?'now':''}"></li>`).join('')}</ol>`;
const opt=(k,v,label,sub,cur,num)=>`<button class="row sel" data-a="wset" data-k="${k}" data-v="${v}"${num?' data-num="1"':''} aria-pressed="${String(cur)===String(v)}"><b>${label}</b><span class="muted">${sub||''}</span></button>`;

  if(kid&&kid!==pm.kid){UI.wiz.likes=[];UI.wiz.skips=[];}render();}
const orderPrice=w=>w.lines?priceOf(w.lines,w.kid):(w.did?dishPrice(w.did,w.size,w.kid):0);

function wizard(){const w=UI.wiz,isO=w.type==='order',last=w.step===4;
  return `<div class="wiz" role="dialog" aria-modal="true" aria-label="${isO?'Order a tiffin':'Subscribe'}"><div class="wh"><button class="ib" data-a="wclose" aria-label="Close">✕</button><b>${isO?'One-time tiffin':w.days+'-day plan'}</b>${dots(4,w.step)}</div>

  <div class="wf">${w.step>(w.cart?3:1)?'<button class="btn ghost" data-a="wback">Back</button>':''}<button class="btn gold grow" data-a="wnext">${last?(isO?'Pay '+inr(orderPrice(w))+' and place order':'Pay '+inr(planPrice(w.tier,w.days,w.size).total)+' and subscribe'):'Continue'}</button></div></div>`;}

function orderStep(w){
  if(w.step===1){
    const types={};nearListings().filter(l=>['sabzi','protein','premium','dal'].includes(l.cat.c)).forEach(l=>{(types[l.did]=types[l.did]||[]).push(l);});
    const list=Object.keys(types).sort((a,b)=>dn(a).localeCompare(dn(b)));
    return `<h2>What would you like?</h2>${segW('size',[['half','Half Tiffin'],['full','Full Tiffin']],w.size)}<p class="muted">${w.size==='half'?'Smaller portion, 2 rotis.':'Regular full meal, 4 rotis.'} Every tiffin comes with dal, roti and rice.</p>${list.map(d=>opt('did',d,`${vm(CAT[d].veg)} ${esc(dn(d))}`,`${types[d].length} kitchen${types[d].length===1?'':'s'} · ${inr(Math.min(...types[d].map(l=>dishPrice(d,w.size,l.kid))))}`,w.did)).join('')}`;}

function wizErr(w){

function validateForm(){
  const f=UI.form,e={},k=f.type==='kitchen',type=f.type,req=(key,msg)=>{if(!String(f[key]??'').trim())e[key]=msg;};
  req('name','Enter your name.');
  if(normPhone(f.phone).length!==10)e.phone='Enter a 10-digit mobile number.';
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(f.email||''))e.email='Enter a valid email address.';
  const motor=!k&&f.vehicle&&f.vehicle!=='Bicycle';
  // documents: required only when the admin has switched them to mandatory (all optional by default)
  DOC_DEFS[type].forEach(d=>{
    if(d.motor&&!motor)return;
    const n=((f.files||{})[d.key]||[]).length;
    if(docMandatory(type,d.key)){
      if(!n)e['files.'+d.key]='Upload your '+d.label.toLowerCase()+'.';
      else if(d.min&&n<d.min)e['files.'+d.key]='Upload at least '+d.min+' files.';
    }
  });
  if(k){
    req('kitchenName','Enter your kitchen name.');req('address','Enter the kitchen address.');
    if(!f.areaId&&f.lat===undefined)e.areaId='Choose the kitchen location or use your current location.';
    req('foodType','Choose a food type.');
    if(!f.diet)e.diet='Choose veg or non-veg.';
    if(!f.dishes.length)e.dishes='Choose at least one dish.';else if(!f.dishes.some(isMain))e.dishes='Include at least one main dish such as a sabzi or protein.';
    const cap=+f.capacity;if(!(cap>=1&&cap<=500))e.capacity='Enter a capacity between 1 and 500.';
    if(!f.hoursOpen||!f.hoursClose||f.hoursOpen>=f.hoursClose)e.hoursOpen='Opening time must be before closing time.';
    const fn=String(f.fssaiNo||'').replace(/\s/g,'');
    if(docMandatory('kitchen','fssai')&&!fn)e.fssaiNo='Enter the 14-digit FSSAI licence number.';
    else if(fn&&!/^\d{14}$/.test(fn))e.fssaiNo='An FSSAI licence number has 14 digits.';
    req('bankHolder','Enter the account holder name.');
    if(!/^\d{9,18}$/.test(String(f.bankAcc).replace(/\s/g,'')))e.bankAcc='Enter a valid bank account number.';
    if(!/^[A-Za-z]{4}0[A-Za-z0-9]{6}$/.test(String(f.bankIfsc).trim()))e.bankIfsc='Enter a valid IFSC code.';
  }else{
    req('address','Enter your home address.');
    if(!f.areaId&&f.lat===undefined)e.areaId='Choose a delivery area.';
    if(!f.vehicle)e.vehicle='Choose a vehicle type.';
    if(motor){req('vehicleNo','Enter the vehicle number.');}
    req('experience','Choose your delivery experience.');
    req('bankHolder','Enter the account holder name.');
    const hasUpi=/^[\w.\-]{2,}@[\w]{2,}$/.test(String(f.upi).trim()),hasBank=/^\d{9,18}$/.test(String(f.bankAcc).replace(/\s/g,''))&&/^[A-Za-z]{4}0[A-Za-z0-9]{6}$/.test(String(f.bankIfsc).trim());
    if(!hasUpi&&!hasBank){e.upi='Give a valid UPI ID, or full bank details.';}
  }
  if(!f.consent)e.consent='Please confirm to continue.';
  return e;
}

    const who=m.from==='user'?(admin?th.name:'You'):m.from==='reception'?'Reception':'Reception (auto-reply)';
    return `<div class="msg ${mine?'me':'them'}${m.from==='auto'?' auto':''}"><small>${esc(who)} · ${fmtT(m.t)}</small><p>${esc(m.text)}</p>${m.ctx?`<span class="ctx">About ${esc(m.ctx)}</span>`:''}</div>`;}).join('');}

   Active only when config.js holds a real project URL and anon key. Otherwise the app runs the
   sample-data prototype. In live mode nothing in the order flow is hardcoded: every kitchen, menu item,
   order, status change, assignment and message comes from (and goes to) the shared database, and every

const Live={expectOutUntil:0,on:false,sb:null,channel:null,realtime:false,timer:null,busy:false,again:false,lastErr:0,locSet:false,readTimer:null,poll:null};
const uuid=()=>(typeof crypto!=='undefined'&&crypto.randomUUID)?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==='x'?r:(r&3|8)).toString(16);});
const todayIST=()=>new Date(Date.now()+5.5*3600e3).toISOString().slice(0,10);
const one=x=>Array.isArray(x)?(x[0]||null):(x||null);
const ROLE_NAME={customer:'CUSTOMER',kitchen_partner:'KITCHEN_PARTNER',delivery_partner:'DELIVERY_PARTNER',admin:'ADMIN'};

Live.configured=function(){
  const c=typeof window!=='undefined'&&window.HIGHWAY_EAT_CONFIG;
  return !!(c&&/^https:\/\/[^\s]+$/.test(c.supabaseUrl||'')&&(c.supabaseAnonKey||'').length>20&&window.supabase&&window.supabase.createClient);
};
Live.msg=e=>String((e&&e.message)||e||'Something went wrong').replace(/^.*?ERROR:\s*/,'').replace(/\s*\(SQLSTATE.*$/,'');
Live.logError=function(e,ctx){
  try{
    if(!Live.on||!S.auth||!S.auth.user)return;
    const n=Date.now();if(n-Live.lastErr<1500)return;Live.lastErr=n;
    Live.sb.rpc('client_log',{p_message:String((e&&e.message)||e),p_stack:String((e&&e.stack)||''),
      p_context:{ctx:ctx,view:UI.c.view,role:UI.role,ua:(navigator.userAgent||'').slice(0,120)}}).then(()=>{},()=>{});
  }catch(x){}
};
Live.rpc=async function(fn,args){
  const {data,error}=await Live.sb.rpc(fn,args||{});
  if(error){if(error.code!=='P0001')Live.logError(error,'rpc:'+fn);throw new Error(Live.msg(error));}
  return data;
};
Live.db=async function(p,ctx){
  const r=await p;
  if(r.error){if(r.error.code!=='P0001')Live.logError(r.error,'db:'+(ctx||''));throw new Error(Live.msg(r.error));}
  return r.data;
};

Live.load=async function(){
  const sb=Live.sb,q=(p,c)=>Live.db(p,c).then(d=>d||[]);

  if(!Live.locSet&&S.areas[0]){S.loc={name:S.areas[0].name||S.areas[0].n,lat:S.areas[0].lat,lng:S.areas[0].lng,custom:false};}

  const capBy={};caps.forEach(c=>capBy[c.kitchen_id]=c);
  const K={},KD={},T={},byUuid={};
  kitchens.forEach(k=>{const c=capBy[k.id];

      cap:c?+c.capacity:+k.default_capacity,used:c?+c.used:0,prep:k.avg_prep_min,caps:k.capabilities||[],area:k.area||'',active:k.status==='active',
      status:k.status,commission:k.commission_pct,payoutToday:0,owner:k.owner_id,photo:pub('kitchen-photos',k.photo_path),defaultCap:+k.default_capacity,addr:k.address||''};
    T[k.id]={_max:+k.default_capacity,_meals:0};});
  kds.forEach(d=>{if(!K[d.kitchen_id]||!CAT[d.dish_key])return;
    const key=d.kitchen_id+':'+d.dish_key;byUuid[d.id]=key;
    KD[key]={key,kid:d.kitchen_id,did:d.dish_key,rating:+d.rating_avg,rc:d.rating_count,orders:d.times_ordered,uuid:d.id,pf:d.price_full,ph:d.price_half,
      status:d.status,active:d.is_active,img:pub('dish-images',d.image_path)};
    T[d.kitchen_id][d.dish_key]={status:'available',todayStatus:d.status,cap:0,confirmed:0,hist:0,favCount:0};});
  S.kitchens=K;S.kd=KD;S.T=T;

  if(!uid){S.auth.user=null;S.cust=S.guest;S.orders=[];S.partners={};S.apps=[];S.chats={};S.notes={};S.customers={};S.payments=[];S.logs={activity:[],errors:[]};return;}

  const [profile,roles,orders,favs,favk,addrs,notes,dpAll,threads,apps]=await Promise.all([
    Live.db(sb.from('profiles').select('*').eq('id',uid).maybeSingle(),'profile'),
    q(sb.from('user_roles').select('role').eq('user_id',uid),'roles'),
    q(sb.from('orders').select('*, order_lines(*), order_items(*), order_status_events(*), delivery_assignments(*), order_private(*)').order('created_at',{ascending:false}).limit(300),'orders'),
    q(sb.from('favourites').select('*').eq('customer_id',uid),'favourites'),
    q(sb.from('favourite_kitchens').select('*').eq('customer_id',uid),'favourite_kitchens'),
    q(sb.from('addresses').select('*').eq('customer_id',uid),'addresses'),
    q(sb.from('notifications').select('*').eq('user_id',uid).order('created_at',{ascending:false}).limit(60),'notifications'),
    q(sb.from('delivery_partners').select('*'),'delivery_partners'),
    q(sb.from('chat_threads').select('*, chat_messages(*)'),'chat'),
    q(sb.from('partner_applications').select('*, application_documents(*), application_events(*)').order('submitted_at',{ascending:false}),'applications')]);
  const roleNames=roles.map(r=>ROLE_NAME[r.role]).filter(Boolean);
  const isAdmin=roleNames.includes('ADMIN');
  const myK=kitchens.find(k=>k.owner_id===uid),myDp=dpAll.find(d=>d.user_id===uid);

  // names of people (admin only can read other profiles)

  names[uid]=S.auth.user.name;

  // customer record
  const fv={};favs.forEach(f=>{const key=byUuid[f.kitchen_dish_id];if(key)fv[key]={rating:f.my_rating||0,times:f.times_ordered};});
  const p=profile||{};
  S.customers={[uid]:{id:uid,name:S.auth.user.name,phone:S.auth.user.phone||'',email:S.auth.user.email,notify:p.notify||{orders:true,taste:true,offers:false},vegOnly:!!p.veg_only,
    tierOverride:null,favs:fv,kfavs:favk.map(f=>f.kitchen_id),addresses:addrs.map(a=>({id:a.id,label:a.label,text:a.text,lat:a.lat,lng:a.lng})),
    pay:[{id:'cod',label:'Cash on delivery'},{id:'upi',label:'UPI on delivery'}],prefsMenu:{kid:'',likes:[],skips:[]}}};
  if(p.default_size&&!Live.sizeSet){S.size=p.default_size;Live.sizeSet=true;}
  S.cust=roleNames.includes('CUSTOMER')?S.customers[uid]:S.guest;

  // partners (a rider sees themself, admin sees all)
  const P={};
  dpAll.forEach(d=>{P[d.user_id]={id:d.user_id,n:d.display_name,online:d.online,loc:d.lat!=null&&d.lng!=null?{lat:d.lat,lng:d.lng}:null,earned:d.earned_total,done:d.deliveries,vehicle:d.vehicle};});

  // orders
  S.orders=orders.map(o=>{
    const priv=one(o.order_private),asg=one(o.delivery_assignments);
    const lines=(o.order_lines||[]).map(l=>({did:l.dish_key,size:l.size,qty:l.qty}));

    return{id:o.public_id,uuid:o.id,cid:o.customer_id,who:priv?priv.customer_name:o.customer_label,kid:o.kitchen_id,did:lines[0]?lines[0].did:'',size:lines[0]?lines[0].size:'full',
      lines,units:+o.units,items:(o.order_items||[]).map(i=>({did:i.dish_key,role:i.role,...(i.qty>1?{qty:i.qty}:{})})),price:o.total,km:+o.distance_km,eta:o.eta_min,
      addr:priv?{text:priv.address_text,area:o.address_area,lat:priv.lat,lng:priv.lng}:{text:o.address_area,area:o.address_area},
      status:o.status,partner:asg?asg.partner_id:null,hist:ev,rated:o.rated,day:'today',payout:asg?asg.payout:0,pay:o.payment_method,payStatus:o.payment_status,created:Date.parse(o.created_at)};
  }).filter(o=>o.lines.length);
  S.partners=P;
  S.payments=S.orders.filter(o=>o.status!=='cancelled').map(o=>({id:o.id,cid:o.cid,what:ordTitle(o),amt:o.price,t:o.created,how:o.pay==='upi'?'UPI':'Cash',state:o.payStatus==='paid'?'paid':'due'}));

  // notifications, chat, applications
  S.notes={[uid]:notes.map(n=>({id:n.id,title:n.title,body:n.body||'',kind:n.kind,t:Date.parse(n.created_at),read:n.read}))};
  S.chats={};
  threads.forEach(t=>{S.chats[t.user_id]={uid:t.user_id,name:names[t.user_id]||'User',role:t.role,status:t.status,unreadAdmin:t.unread_admin,unreadUser:t.unread_user,
    msgs:(t.chat_messages||[]).slice().sort((a,b)=>Date.parse(a.created_at)-Date.parse(b.created_at)).map(m=>({id:m.id,from:m.sender,text:m.body,ctx:m.ctx,t:Date.parse(m.created_at)}))};});
  S.apps=apps.map(a=>({id:a.public_id,uuid:a.id,type:a.type,uid:a.applicant_id,applicant:{name:a.form.name,phone:a.form.phone,email:a.form.email},form:a.form,
    docs:(a.application_documents||[]).map(d=>({key:d.doc_key,kind:(docDef(a.type,d.doc_key)||{label:d.doc_key}).label,name:d.file_name,path:d.storage_path})),
    reqSnapshot:a.req_snapshot||{},status:a.status,date:Date.parse(a.submitted_at),verify:{docs:a.verified_docs,location:a.verified_location,contact:a.verified_contact},
    msg:a.decision_note||'',grant:a.grant_ref,
    history:(a.application_events||[]).slice().sort((x,y)=>x.id-y.id).map(e=>({s:e.status,t:Date.parse(e.at),by:e.actor_id===a.applicant_id?'applicant':'admin',note:e.note}))}));

  S.logs={activity:[],errors:[]};
  if(isAdmin){
    const [act,err]=await Promise.all([q(sb.from('activity_log').select('*').order('at',{ascending:false}).limit(80),'activity'),

Live.refresh=async function(){
  if(Live.busy){Live.again=true;return;}
  Live.busy=true;

};

};

/* ---------- realtime ---------- */
Live.subscribe=function(){
  try{if(Live.channel)Live.sb.removeChannel(Live.channel);}catch(e){}
  const ch=Live.sb.channel('highway-eat-'+uuid().slice(0,8));
  ['orders','order_status_events','delivery_assignments','kitchens','kitchen_dishes','kitchen_capacity','chat_messages','chat_threads','notifications',
   'partner_applications','document_requirements','delivery_partners','app_settings','activity_log','error_log']
    .forEach(t=>ch.on('postgres_changes',{event:'*',schema:'public',table:t},()=>Live.soon()));
  ch.subscribe(status=>{
    Live.realtime=status==='SUBSCRIBED';
    if(typeof document!=='undefined')document.querySelectorAll('.livedot').forEach(el=>el.classList.toggle('on',Live.realtime));
  });
  Live.channel=ch;
  if(!Live.poll)Live.poll=setInterval(()=>{if(typeof document==='undefined'||!document.hidden)Live.soon();},20000);   // safety net if a realtime message is missed
};

function adminLogs(){
  const L=S.logs||{activity:[],errors:[]};
  return `<section class="card2"><h2 class="sh">Errors</h2>${L.errors.length?tbl(['When','Who','Where','Message'],L.errors.map(e=>[fmtD(Date.parse(e.at))+' '+fmtT(Date.parse(e.at)),esc((e.user_id||'').slice(0,8)),esc((e.context&&e.context.ctx)||e.source),esc(e.message)])):'<p class="muted">No errors recorded.</p>'}</section>
  <section class="card2"><h2 class="sh">Activity</h2>${L.activity.length?tbl(['When','Action','Item','Who'],L.activity.map(a=>[fmtD(Date.parse(a.at))+' '+fmtT(Date.parse(a.at)),esc(a.action),esc(a.entity_id||''),esc((a.actor_id||'').slice(0,8))])):'<p class="muted">No activity yet.</p>'}</section>`;
}

/* ---------- mutations: every one goes to the shared database, then everyone is refreshed ---------- */
Live.install=function(){
  const done=async(msg)=>{await Live.refresh();if(msg)toast(msg);render();};
  const appOf=id=>S.apps.find(a=>a.id===id);
  const orderOf=id=>S.orders.find(o=>o.id===id);
  const origSignout=H.signout;

  Object.assign(H,{
    async dologin(){const a=UI.auth;a.err='';
      try{if(!a.email||!a.password)throw new Error('Enter your email and password.');await Live.signIn(a.email,a.password);afterLogin(S.auth.user);}
      catch(e){a.err=e.message;render();}},
    async dosignup(){const a=UI.auth;a.err='';
      try{
        if(!(a.name||'').trim())throw new Error('Enter your name.');
        if(normPhone(a.phone).length!==10)throw new Error('Enter a 10-digit mobile number.');
        if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(a.email||''))throw new Error('Enter a valid email address.');
        if((a.password||'').length<8)throw new Error('Use a password of at least 8 characters.');
        await Live.signUp(a.name,a.phone,a.email,a.password);afterLogin(S.auth.user);toast('Welcome to Highway Eat, '+S.auth.user.name.split(' ')[0]+'!');
      }catch(e){a.err=e.message;render();}},
    async dostaff(){const s=UI.staff;s.err='';
      try{
        await Live.signIn(s.email,s.password);
        if(!S.auth.user.roles.includes('ADMIN')){Live.expectOutUntil=Date.now()+3000;await Live.sb.auth.signOut();signOut();await Live.refresh();throw new Error('Those details are not correct.');}
        UI.staff={email:'',password:'',code:'',err:''};UI.role='admin';UI.screen='app';UI.a.tab='applications';UI.a.open=null;window.scrollTo(0,0);render();
      }catch(e){s.err=e.message;s.password='';render();}},
    async signout(){Live.expectOutUntil=Date.now()+3000;try{await Live.sb.auth.signOut();}catch(e){}signOut();await Live.refresh();Live.subscribe();origSignout();},
    subwiz(){toast('Subscriptions are coming soon.');},
    simulate(){},
    /* customer */
    async fav(d){const kd=S.kd[d.key];if(!kd)return;const on=await Live.rpc('toggle_favourite',{p_kd:kd.uuid});await done(on?'Saved to My Taste':'Removed from My Taste');},
    async favk(d){const uid=S.auth.user.id;
      if(S.cust.kfavs.includes(d.kid))await Live.db(Live.sb.from('favourite_kitchens').delete().eq('customer_id',uid).eq('kitchen_id',d.kid),'favk');
      else await Live.db(Live.sb.from('favourite_kitchens').insert({customer_id:uid,kitchen_id:d.kid}),'favk');await done();},
    async favrate(d){const kd=S.kd[d.key];await Live.rpc('set_favourite_rating',{p_kd:kd.uuid,p_stars:+d.n});await done();},
    async cancel(d){const o=orderOf(d.id);await Live.rpc('order_cancel',{p_order:o.uuid});await done('Order cancelled and the kitchen slot released.');},
    async submitrate(d){const r=UI.rate,o=orderOf(d.id);if(!r.overall){toast('Give an overall rating first.');return;}
      await Live.rpc('order_rate',{p_order:o.uuid,p_overall:r.overall,p_kitchen:r.kitchen||null,p_dishes:r.dishes||{}});UI.rate=null;await done('Thanks. Dish ratings will shape your recommendations.');},
    async saveacct(){const A=UI.set;
      if(!A.name.trim())throw new Error('Enter your name.');
      if(A.email.trim()&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(A.email.trim()))throw new Error('Enter a valid email address.');
      await Live.db(Live.sb.from('profiles').update({full_name:A.name.trim(),email:A.email.trim()||null}).eq('id',S.auth.user.id),'profile');await done('Saved.');},
    async addaddr(){const A=UI.set;
      if(A.label.trim().length<2)throw new Error('Give the address a label, such as Home.');
      if(A.text.trim().length<5)throw new Error('Enter the full address.');
      await Live.db(Live.sb.from('addresses').insert({customer_id:S.auth.user.id,label:A.label.trim(),text:A.text.trim(),lat:S.loc.lat,lng:S.loc.lng}),'address');
      A.label='';A.text='';await done('Address saved.');},
    async deladdr(d){if(S.cust.addresses.length<=1)throw new Error('Keep at least one address so you can order.');
      await Live.db(Live.sb.from('addresses').delete().eq('id',d.id),'address');await done('Address removed.');},
    async setnotify(d){const c=S.cust,patch={};
      if(d.k==='veg'){patch.veg_only=!c.vegOnly;}
      else{const n={...c.notify};n[d.k]=!(d.k==='offers'?!!n.offers:n[d.k]!==false);patch.notify=n;}
      await Live.db(Live.sb.from('profiles').update(patch).eq('id',S.auth.user.id),'profile');await done('Saved.');},
    async notes(){if(!S.auth.user){UI.screen='login';UI.auth.note='Log in to see your notifications.';render();return;}
      UI.menu=false;go('notes');Live.rpc('mark_notifications_read').then(()=>Live.refresh()).then(render).catch(()=>{});},
    /* chat */
    async helpchat(d){if(!S.auth.user){UI.menu=false;UI.screen='login';UI.auth.note='Log in to chat with reception.';render();return;}
      UI.menu=false;UI.chatCtx=d&&d.ctx?d.ctx:null;UI.focusChat=true;go('chat');},
    async adminthread(d){await Live.rpc('chat_open_admin',{p_user:d.uid});UI.a.chat=d.uid;UI.focusChat=true;await done();},
    async adminreply(){await Live.rpc('chat_reply',{p_user:UI.a.chat,p_text:UI.chatText.admin||''});UI.chatText.admin='';UI.focusChat=true;await done();},
    async adminresolve(){await Live.rpc('chat_resolve',{p_user:UI.a.chat});await done('Marked resolved.');},
    /* kitchen and delivery */
    async kact(d){const o=orderOf(d.id);await Live.rpc('order_advance',{p_order:o.uuid,p_action:d.act});await done('Order updated. The customer sees it instantly.');},
    async dact(d){const o=orderOf(d.id);await Live.rpc('order_advance',{p_order:o.uuid,p_action:d.act});await done(d.act==='deliver'?'Delivered. Earnings updated.':'');},
    async donline(){const p=S.partners[ses('delivery').id],on=!p.online,pos=on?await geoNow():{};
      await Live.db(Live.sb.from('delivery_partners').update({online:on,last_seen:new Date().toISOString(),...pos}).eq('user_id',S.auth.user.id),'online');await done(on?'You are online.':'You are offline.');},
    async kmremove(d){await Live.db(Live.sb.from('kitchen_dishes').update({is_active:false}).eq('id',d.id),'menu');await done('Dish removed from your menu.');},
    /* partner applications */
    async freply(d){const a=appOf(d.id);await Live.rpc('respond_application',{p_id:a.uuid,p_text:UI.form.reply||''});UI.form.reply='';await done('Reply sent. Your application is back under review.');},
    async opendoc(d){const {data,error}=await Live.sb.storage.from('application-docs').createSignedUrl(d.path,300);
      if(error)throw new Error('Could not open the file.');window.open(data.signedUrl,'_blank','noopener');},
    /* admin */
    async aopen(d){const a=appOf(d.id);await Live.rpc('review_application',{p_id:a.uuid,p_action:'review'});UI.a.open=d.id;UI.a.act=d.act||'';UI.a.text='';window.scrollTo(0,0);await done();},
    async averify(d){const a=appOf(d.id);await Live.rpc('review_application',{p_id:a.uuid,p_action:'verify',p_key:d.k});await done();},
    async adecide(d){const a=appOf(d.id),m=UI.a.act;
      await Live.rpc('review_application',{p_id:a.uuid,p_action:m,p_text:UI.a.text||null});
      const msg={approve:'Accepted. The partner account is active and they have been notified.',reject:'Rejected. The applicant can see the reason.',info:'Requested. The applicant has been notified.'}[m];
      UI.a.act='';UI.a.text='';await done(msg);},
    async adocreq(d){const was=docReq(d.t,d.k).required;await Live.rpc('set_document_requirement',{p_type:d.t,p_key:d.k,p_required:!was,p_from:null});await done(was?'Now optional.':'Now mandatory.');},
    async adocreset(d){await Live.rpc('reset_document_requirements',{p_type:d.t});await done('Every '+(d.t==='kitchen'?'kitchen':'delivery')+' partner document is optional again.');},
    async akact(d){const k=S.kitchens[d.id];await Live.rpc('admin_set_kitchen',{p_kitchen:d.id,p_status:k.active?'paused':'active',p_commission:null});await done();}
  });
  Object.assign(HI,{
    async adocdate(v,d){await Live.rpc('set_document_requirement',{p_type:d.t,p_key:d.k,p_required:true,p_from:v||null});await done(v?'Becomes mandatory from '+v+'.':'Mandatory straight away.');},
    async acomm(v,d){await Live.rpc('admin_set_kitchen',{p_kitchen:d.id,p_status:null,p_commission:Math.max(0,Math.min(40,parseInt(v,10)||0))});await done();},
    async radius(v){await Live.rpc('set_service_radius',{p_km:parseInt(v,10)||20});await done('Service radius is now '+S.radius+' km for every customer.');},
    async kmprice(v,d){const n=Math.max(0,parseInt(v,10)||0);await Live.db(Live.sb.from('kitchen_dishes').update({[d.f]:n}).eq('id',d.id),'menu');await done('Price saved.');},
    async kmstatus(v,d){await Live.db(Live.sb.from('kitchen_dishes').update({status:v}).eq('id',d.id),'menu');await done('Saved.');},
    async kmadd(v,d){if(!v)return;
      const pf=CAT[v].p,ph=halfPrice(pf);
      await Live.db(Live.sb.from('kitchen_dishes').upsert({kitchen_id:d.kid,dish_key:v,price_full:pf,price_half:ph,is_active:true,status:'available'},{onConflict:'kitchen_id,dish_key'}),'menu');
      await done(dn(v)+' added to your menu.');},
    async kmcap(v){const k=S.kitchens[ses('kitchen').kid],n=Math.max(0,parseInt(v,10)||0);
      await Live.db(Live.sb.from('kitchens').update({default_capacity:n}).eq('id',k.id),'capacity');
      await Live.db(Live.sb.from('kitchen_capacity').upsert({kitchen_id:k.id,service_date:todayIST(),capacity:n},{onConflict:'kitchen_id,service_date'}),'capacity');
      await done('Capacity saved.');}
  });

  /* ordering: the server prices the order, checks the 20 km rule and reserves capacity in one step */
  wizFinish=function(w){
    if(UI.wiz&&UI.wiz.busy)return;
    if(w.type!=='order'){toast('Subscriptions are coming soon.');return;}
    const a=addrList().find(x=>x.id===w.addr);
    const lines=(w.lines||[{did:w.did,size:w.size,qty:1}]).map(l=>({did:l.did,size:l.size,qty:l.qty}));
    UI.wiz.busy=true;UI.wiz.err='';render();
    return Live.rpc('place_order',{p_kitchen:w.kid,p_lines:lines,p_address:{text:a.text,area:a.label||'Nearby',lat:a.lat,lng:a.lng},p_pay:w.pay==='upi'?'upi':'cod',p_id:uuid()})
      .then(async id=>{await Live.refresh();if(w.cart)UI.cart={kid:null,lines:[]};UI.wiz=null;const o=S.orders.find(x=>x.uuid===id);go('track',o?o.id:null);toast('Order placed. The kitchen will confirm shortly.');})
      .catch(e=>{if(UI.wiz){UI.wiz.busy=false;UI.wiz.err=e.message;}render();});
  };
  submitPartnerForm=async function(){
    const f=UI.form,errs=validateForm();UI.formErr=errs;
    if(Object.keys(errs).length){render();const first=Object.keys(errs)[0],el=document.getElementById(eid(first));if(el){el.scrollIntoView({block:'center'});try{el.focus();}catch(x){}}return;}
    toast('Uploading your documents…');
    const uid=S.auth.user.id,folder=uuid().slice(0,8),docs=[];
    for(const key of Object.keys(UI.fileObjs||{})){
      for(const file of UI.fileObjs[key]){
        const path=uid+'/'+folder+'/'+key+'/'+safeName(file.name);
        const {error}=await Live.sb.storage.from('application-docs').upload(path,file,{upsert:false,contentType:file.type||undefined});
        if(error){Live.logError(error,'upload');throw new Error('Upload failed: '+Live.msg(error));}
        docs.push({key,name:file.name,path});
      }
    }
    const id=await Live.rpc('submit_application',{p_type:f.type,p_form:partnerPayload(),p_docs:docs});
    UI.form={};UI.formErr={};UI.fileObjs={};await Live.refresh();
    const a=S.apps.find(x=>x.uuid===id);UI.c.view='pstatus';UI.c.param=a?a.id:null;window.scrollTo(0,0);render();toast('Application submitted. You will be notified after review.');
  };
  sendChat=function(text){
    const role=UI.role==='customer'?'customer':UI.role==='delivery'?'delivery':'kitchen';
    return Live.rpc('chat_send',{p_text:text,p_role:role,p_ctx:UI.chatCtx||null}).then(async()=>{UI.chatText.user='';UI.chatCtx=null;UI.focusChat=true;await Live.refresh();render();});
  };
  const origMine=api.chatMine;
  api.chatMine=function(sess){const th=chatThread(sess);if(th.unreadUser>0)Live.markRead();th.unreadUser=0;return th;};
  api.ordersFor=(function(orig){return function(sess){return orig(sess);};})(api.ordersFor);

  /* photos for kitchens and dishes go to Supabase Storage */
  document.addEventListener('change',async e=>{
    const t=e.target;if(!t||!t.dataset)return;
    try{
      if(t.dataset.kmimg||t.dataset.kmcover){
        const file=t.files&&t.files[0];if(!file)return;
        if(file.size>5*1024*1024)throw new Error('Please choose a photo under 5 MB.');
        const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,5)||'jpg';
        const kid=ses('kitchen').kid;
        if(t.dataset.kmimg){
          const path=kid+'/'+t.dataset.kmimg+'-'+Date.now()+'.'+ext;
          await Live.db(Live.sb.storage.from('dish-images').upload(path,file,{upsert:true,contentType:file.type}),'upload');
          await Live.db(Live.sb.from('kitchen_dishes').update({image_path:path}).eq('id',t.dataset.kmimg),'menu');
        }else{
          const path=kid+'/cover-'+Date.now()+'.'+ext;
          await Live.db(Live.sb.storage.from('kitchen-photos').upload(path,file,{upsert:true,contentType:file.type}),'upload');
          await Live.db(Live.sb.from('kitchens').update({photo_path:path}).eq('id',kid),'kitchen');
        }
        await Live.refresh();toast('Photo saved.');render();
      }
    }catch(err){toast(err.message);}
  });
};

/* ---------- start ---------- */
Live.start=async function(){
  const c=window.HIGHWAY_EAT_CONFIG;
  Live.sb=window.supabase.createClient(c.supabaseUrl,c.supabaseAnonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
  Live.on=true;CONFIG.DEMO_MODE=false;window.HIGHWAY_EAT_DATA={};
  buildState();loadTheme();Live.install();
  window.addEventListener('error',ev=>Live.logError(ev.error||ev.message,'window.error'));
  window.addEventListener('unhandledrejection',ev=>Live.logError(ev.reason,'unhandledrejection'));
  Live.sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT'&&S.auth.user&&Date.now()>Live.expectOutUntil){signOut();Live.refresh().then(()=>{UI.role='customer';UI.screen='welcome';render();});}});
  await Live.refresh();
  UI.screen=S.auth.user?'app':'welcome';
  if(S.auth.user){const u=S.auth.user;UI.role=u.roles.includes('KITCHEN_PARTNER')&&sessionFor('kitchen')?'kitchen':u.roles.includes('DELIVERY_PARTNER')&&sessionFor('delivery')?'delivery':'customer';}
  Live.subscribe();Live.locate();
};

/* start the app once every module above has loaded */
async function liveBoot(){
  const sp=document.getElementById('splash'),si=document.getElementById('splashimg');if(si)si.src=LOGO_STACK;
  const hide=()=>{if(!sp)return;sp.classList.add('out');setTimeout(()=>sp.remove(),400);};
  try{
    await Live.start();render();
    if(sp){sp.addEventListener('click',hide);setTimeout(hide,1200);}
    window.addEventListener('hashchange',routeHash);routeHash();
  }catch(e){
    hide();
    document.getElementById('root').innerHTML='<div class="empty"><div class="big" aria-hidden="true">⚠️</div><h2>Cannot reach the Highway Eat server</h2><p>'+esc(Live.msg(e))+'</p><p class="muted">Check config.js (project URL and anon key) and that the SQL files were run in Supabase.</p></div>';
  }
}
if(typeof document!=='undefined'&&document.getElementById&&typeof window!=='undefined'&&window.__HW_TEST__!==true){
  if(Live.configured())liveBoot();else boot();
}
